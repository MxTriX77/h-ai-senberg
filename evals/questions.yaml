# Eval set: chemistry and physics questions with known answers (run: uv run python -m evals.run).
# Questions were written for this project. Known answers come from these sources only:
sources:
  codata: CODATA 2022 recommended values, NIST allascii.txt (US government work, public domain)
  pubchem: PubChem compound data, NCBI (no restrictions on the data); molar masses computed from the formula
  wikipedia: >-
    Facts stated in the Wikipedia articles of the Layer 1 store (CC BY-SA 4.0); only the fact is used,
    no text is copied
#
# answer kinds:
#   number: value, with abs_tol or rel_tol    formula: Hill-order match    text: accepted words (any, whole word)
# Scored on the answer line the answer target asks for (A1:, as in the reasoning problems; no line is wrong); a
# match anywhere in the answer, the score of earlier runs, stays as loose_correct.
# No questions about people (D-017).

# Appended to every question after a blank line.
answer_target: |-
  Finish your answer with exactly this line:
  A1: <your final answer, with its unit if it has one>


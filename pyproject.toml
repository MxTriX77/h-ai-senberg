[project]
name = "haisenberg"
version = "0.1.0"
description = "Local, verifiable research chat for chemistry and physics"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
haisenberg = "haisenberg.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

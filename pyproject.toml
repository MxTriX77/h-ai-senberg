[project]
name = "haisenberg"
version = "0.1.0"
description = "Local, verifiable research chat for chemistry and physics"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "libzim>=3.13.1,<3.14",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
haisenberg = "haisenberg.cli:main"
haisenberg-l1 = "haisenberg.l1.cli:main"
haisenberg-l2 = "haisenberg.l2.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # tests import the ingest/ scripts

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

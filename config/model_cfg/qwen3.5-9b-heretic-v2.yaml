# Qwen3.5-9B-heretic-v2 (trohrbaugh; mirrored as ansulev/Qwen3.5-9B-heretic-v2, identical weights):
# Qwen3.5-9B with refusals removed (Heretic v1.2.0 abliteration).
# UGI leaderboard: willingness 9.5/10, NatInt 24.2 vs 30.98 for plain Qwen3.5-9B: the best small
# uncensored model measured, but it is less smart than the default model.
# Same architecture, chat and tool template as the default model; fits the 6 GB GPU fully.
# GGUF: mradermacher/Qwen3.5-9B-heretic-v2-i1-GGUF, i1-Q4_K_M (5.6 GB). License: Apache-2.0.
# Use: MODEL_PROFILE=qwen3.5-9b-heretic-v2

model_backend:
  model_id: "${MODEL_ID:-qwen3.5-9b-heretic-v2}"

llama_server:
  model_path: "${MODEL_PATH:-models/Qwen3.5-9B-heretic-v2.i1-Q4_K_M.gguf}"

verifier:
  consistency_check: false                 # off for this model (D-049, D-055): on 184 recorded answers the review
                                           # applied 7 fixes, 5 of them wrong, for 17 to 19 % of the answer time
  support_quotes: true                     # on for this model (D-064): a "supported" mark needs words that code finds
                                           # in the passage. On 184 recorded answers the judge as shipped marked 292
                                           # claims supported, 230 of them falsely; with this and claims_any_script on
                                           # it marks 75, 22 of them falsely (true ones: 59 → 53). No answer text
                                           # changed. The judge takes 17 s per how-to answer, as before, and 5.4 s per
                                           # general one (3.8 s before). Weak side: with the literature store about
                                           # half of the true supports of how-to answers are lost (11 of 21 kept on
                                           # unseen answers, where the false ones fall from 91 to 12)
  claims_any_script: true                  # on with support_quotes (D-064): a Russian sentence can be a claim (42
                                           # recorded Russian answers: 2.9 → 11.0 claims per answer, 5 supports, 3 true)
  judge_batch: "${JUDGE_BATCH:-5}"         # claims per judge call: the value both switches were measured with

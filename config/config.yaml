# h-ai-senberg configuration: the one file that controls models, endpoints, prompts, paths and launch.
# Any string may use ${VAR} or ${VAR:-default}; values come from the environment or `.env`
# (the real environment wins). Every variable used here is listed in `.env.example`.
# Relative paths resolve against the project root (the folder that holds `config/`).

app:
  host: "${APP_HOST:-127.0.0.1}"
  port: "${APP_PORT:-8000}"
  debug: false
  keepalive_s: 1                           # SSE keep-alive after this much silence (the WebUI drops a stream silent for 3 s)

model_backend:
  provider: "openai_compatible"            # informational; every backend speaks the OpenAI chat API
  api_base: "${API_BASE_URL:-http://127.0.0.1:8080/v1}"
  api_key: "${API_KEY:-}"                  # empty for local llama-server; set in .env for cloud backends
  model_id: "${MODEL_ID:-qwen3.5-9b}"      # sent as `model`; also llama-server's --alias
  temperature: 0.6
  seed: "${EVAL_SEED:-}"                   # for eval A/Bs (same draws in both arms); empty = no seed; production chat leaves it unset
  max_tokens: 4096                         # per call: thinking (llama_server reasoning-budget) + answer
  timeout_s: null                          # read limit in s; null = wait as long as the backend needs (queue, slow prompt)
  wait_s: 300                              # retry a backend that refuses connections or answers 503 (loading, restarting)
  context_tokens: null                     # backend context in tokens; null = llama_server.ctx_size
  chars_per_token: 2.0                     # token estimate for the context budget (real tool results: 2.4-5.2)
  extra_body:                              # per-model sampling quirks, merged into each request
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0

reasoning_policy:
  system_prompt: |
    You are a careful assistant for chemistry and physics.
    Answer precisely and use SI units unless the question asks otherwise.
    For any number, show the working: the formula, the values you used and the result with its unit.
    If you are not sure, say so plainly instead of guessing.
    Never invent sources, citations, data or quotes.
    When the evidence or a calculation settles a question, give a clear verdict (true or false, yes or no,
    consistent or inconsistent). Say "unconfirmed" or "cannot be determined" only when the needed data is
    really missing, and say what is missing.
    Let every verdict follow from its own reason. "Not shown" is not "false": call a claim false only
    when the data, a source or a calculation contradicts it. Timing, a correlation, a ratio or one example
    never proves a cause or a general rule, so a claim that the evidence proves, guarantees, confirms or
    independently verifies something is false when that evidence cannot give it. Judge the claim, not only
    its arithmetic: a right calculation on a wrong input does not make the claim right. A correction is a
    claim too: when you say what something is instead (its role, class, mechanism or value), base it on the
    data, a lookup or a calculation; if they do not settle it, say the claim is wrong or unproven without
    stating a replacement as fact.
    Before you use the numbers you are given, check that they agree with each other (amounts against
    masses, ratios, totals), and point out any that do not.
    Your conclusions and summary must agree with your own calculations. Flag any result that is physically
    impossible or implausible, such as a yield above 100 %, a negative concentration or a speed above c.
    Follow every explicit instruction: use the values you are told to use, do not infer what you are told
    not to infer, and use the requested format.
    You have no internet access. When a check needs something you cannot reach (the web, a DOI or
    publisher registry, a full paper, an outside database), say that it could not be verified (no web
    access). Never judge a reference, DOI, link or title valid or invalid from how it looks.
  tool_prompt: |                           # added to the system prompt when knowledge tools are offered
    You can look facts up in offline sources with the tools. Before you answer a factual question,
    look up what you need: search_knowledge for concepts, laws, properties and explanations, and the
    lookup tools for compound data and physical constants. A few precise lookups beat many vague ones.
    Every result has a source id such as [S1]. Put the id of the result you used right after each fact
    you take from it, for example: "Ethanol boils at 78.2 °C [S1]." Cite only ids you were given.
    If the results do not contain what you need, say so, and say which parts come from your own knowledge.
    Compute every number you state with the calculate tool, not in your head: products, quotients,
    percentages, powers, roots, logarithms, unit conversions, and also side calculations such as
    "to reach X you would need Y". Put all the calculations of a step into one calculate call (it takes
    a list of expressions). When you revise a number, recompute everything that depends on it.
  enable_multi_hop_verification: true      # check the draft claim by claim before answering (see verifier)
  max_search_depth: 3                      # tool rounds per answer (each round may call several tools); 0 = no tools
  max_calc_rounds: 1                       # rounds of calculate calls only, on top: they use no lookup rounds; 0 = they do
  text_tool_calls: true                    # a tool call written as text in the reply is run when its tool has rounds
                                           # left, else removed and the final answer asked for again (once)
  tool_call_markup:                        # how chat templates write a tool call as text (regex; . matches newlines)
    call: '<tool_call>.*?(?:</tool_call>|$)|<function=.*?(?:</function>(?:\s*</tool_call>)?|$)'   # Hermes/Qwen wrapper or bare Qwen3.5 XML, also cut off
    function: '<function=([^>\s]+)>'       # Qwen3.5 XML: the tool name; a call without it is read as JSON {"name", "arguments"}
    parameter: '<parameter=([^>\s]+)>\s*(.*?)\s*(?:</parameter>|(?=<parameter=|</function>)|$)'   # ... and each argument
  empty_answer_retry: true                 # an empty final answer (all of it left in the thinking) is asked for again (once)
  run_written_calculations: true           # calculate calls written as text where they cannot run as a round (after the
                                           # last round, or in the retry) are run anyway and their results given to
                                           # the retry; a calculation written in the retry costs one more call (at most)
  answer_retry_prompt: |                   # the user turn of that call (also after a removed tool call or a run calculation)
    Tools are no longer available. Write your complete final answer to the question above now, as plain
    text without any tool call: use the results you have, show the working and keep the format the
    question asks for.
  answer_retry_request:                    # fields merged into that call
    chat_template_kwargs: {enable_thinking: false}   # llama.cpp + Qwen templates: answer at once, no thinking

retrieval:                                 # used from the Layer 1 step on
  raw_dir: "${DATA_DIR:-data}/raw"         # downloads listed in config/sources.yaml
  stores:                                  # knowledge stores: name -> kind (which ingest builds it, which code reads it), path
    encyclopedia: {kind: encyclopedia, path: "${DATA_DIR:-data}/encyclopedia_fts.db"}   # Layer 1, ingest.build_l1
    literature: {kind: literature, path: "${DATA_DIR:-data}/literature_fts.db"}         # Layer 2, ingest.build_l2
  knowledge_sets:                          # knowledge setting -> the stores it enables
    base: [encyclopedia]
    extended: [encyclopedia, literature]
  knowledge: "${KNOWLEDGE:-base}"          # A/B switch: the knowledge set the tools read (base = Layer 1 only)
  layer2_literature_index: "${DATA_DIR:-data}/vector_store/"
  layer2_chunk_chars: 1200                 # longest passage the Layer 2 build stores
  literature_k: 2                          # literature passages appended to each search_knowledge result (if enabled)
  top_k_proofs: 5                          # records per search or lookup (agent tools, encyclopedia search default)
  passage_chars: 1500                      # longest article passage handed to the model per record
  min_term_share: 0.5                      # search hits must show this share of the query's words (title or named-article hits always kept); 0 = off
  label_sources: true                      # with a literature store enabled: each result says what its source is (source_labels)
                                           # and search_knowledge's description gets its `literature` text; false: as before.
                                           # No effect without a literature store (base)
  source_labels:
    reference: "reference data"            # Layer 1 records: encyclopedia leads and infoboxes, compounds, constants
    literature: "literature: explanatory text, its numbers may differ by source or conditions"

tools:                                     # texts of the agent tools; which tools exist follows the sources in the store (D-021)
  search_knowledge:
    description: >-
      Search the offline encyclopedia (lead sections and infoboxes of Wikipedia articles) for concepts,
      laws, phenomena, elements and compounds. Returns the best-matching passages, each with a source id.
    parameters:
      query: "A few keywords naming the topic, e.g. 'ethanol boiling point' or 'photoelectric effect'."
      domain: "Optional: search only this subject area."
    literature: >-
      Results may also include literature passages (textbook sections, full articles, Q&A answers), marked as
      literature; encyclopedia records and lookup results are marked as reference data. Take property values
      and constants from the reference data, and use literature for explanations, mechanisms and context.
      When literature gives a different value than the reference data, give the reference value (you may
      mention the other).
  lookup_compound:
    description: >-
      Look up a chemical compound in PubChem by name, CAS number, CID or molecular formula. Returns its
      formula, molar mass, monoisotopic mass and synonyms, each record with a source id.
    parameters:
      query: "Compound name, CAS number (e.g. 64-17-5), PubChem CID or formula (e.g. C2H6O)."
  lookup_constant:
    description: >-
      Look up a physical constant (CODATA 2022) by name. Returns its value, uncertainty and unit,
      each record with a source id.
    parameters:
      query: "Constant name, e.g. 'Planck constant', 'electron mass' or 'Avogadro constant'."
  calculate:                               # built in: offered whenever the knowledge tools are
    description: >-
      Evaluate arithmetic expressions exactly: numbers (6.022e23 or 6.022 * 10^23), + - * / ^,
      parentheses, sqrt, exp, ln, log (base 10), log2, sin, cos, tan, asin, acos, atan, abs, min, max,
      pi and e. Plain numbers only, no units or variable names. Put all the calculations of a step into
      one call. Returns one line per expression with its value.
    parameters:
      expressions: 'The expressions, e.g. ["2.10 / (2.00 / 138.12 * 180.16) * 100", "sqrt(2 * 9.81 * 5)"].'

verifier:                                  # claim checks on the draft; on/off: reasoning_policy.enable_multi_hop_verification
  judge_prompt: |
    You check the claims of an answer against numbered source passages, using only the passages.
    Give each claim one verdict:
    - supports: a passage states the claim (rounding, equivalent units and wording are fine)
    - contradicts: a passage states a different value or fact for the same quantity or property of the same thing
    - not_said: no passage settles the claim
    - no_claim: the sentence states no checkable fact (a plan, a heading, a remark, a question, or a result or
      conclusion the answer worked out from the task's own data)
    Reply with exactly one line per claim and nothing else, like this:
    C1: supports S2
    C2: contradicts S1 | the claim rewritten so that it agrees with S1
    C3: not_said
    C4: no_claim
    After supports or contradicts, give the ids of the passages that decide it.
  rel_tol: 0.001                           # numbers: relative tolerance on top of the claim's own rounding
  unit_checks: true                        # a number is checked against a record value only as the same quantity: no
                                           # other unit after it (J s = J Hz^-1, m/s = m per second; km/h, eV s differ)
                                           # and no other property named nearest it ("boils at" is not a molar mass);
                                           # it is corrected only with the record's unit, or with the property (or the
                                           # constant) named; false: numbers alone (cited constants correct any number
                                           # within a factor of ten)
  arithmetic_check: true                   # recompute every "a × b = c" in the draft and fix wrong results
  arithmetic_rel_tol: 0.005                # ... when c is off by more than its rounding and this share
  arithmetic_prefixes: true                # ... and also off when scaled by 10^±3/6/9 where a unit of the chain has an
                                           # SI prefix (2452 W = 2.45 kW, 250 mg × 6 = 1.5 g); false: c as written only
  arithmetic_answer_lines: true            # ... and a labelled answer line (A1: …) that states exactly the old wrong c,
                                           # once, gets the fixed value too; false: answer lines keep their values
  arithmetic_strict_parse: true            # read only a whole left side: a × 10ⁿ is one number (6.4 × 10⁷ ÷ 2.0 × 10⁶ = 32),
                                           # a currency sign before a number is dropped, an expression with math right before
                                           # it (an operator, "(", ½, π, "half of", "million") or a scale suffix (1.3B, 20k)
                                           # is skipped, and so is a wrong c that is a unit conversion (bits → GB, m → cm);
                                           # false: as before
  arithmetic_max_change: 100               # a fix that changes c by this factor or more, flips its sign or goes to or from 0
                                           # (at c's precision), and a division whose c is the reciprocal of its value, is not
                                           # applied, only listed in the reasoning; 0 = no limit (every fix applied)
  skip_derived_claims: true                # computations (an equation or operation with numbers, or a sentence restating
                                           # the answer's results) and labelled answer/verdict lines (A1: …, Claim C: …)
                                           # are never judged, corrected or removed by the claim checks
  keep_uncorrected: true                   # a judge "contradicts" without a correction marks the claim unverified;
                                           # false: the claim is removed
  ignore_prompt_echo: true                 # a judge correction that repeats judge_prompt (all of it, or five words in a
                                           # row, ids aside) is ignored: the claim counts as uncorrected (see above)
  judge_minimal_edits: true                # a judge correction is applied only as a minimal edit: it replaces 1-3 terms
                                           # (numbers by value, words, formulas, unit symbols) by 1-3 terms, adds or
                                           # drops none, changes no word to one that contains it (balanced →
                                           # unbalanced), and every term it puts in is in the passages the judge cited
                                           # (numbers within rounding); only those terms change in the claim. Anything
                                           # else leaves the claim as written, unverified, with the reason in the
                                           # reasoning; false: the correction replaces the whole claim
  keep_quotes: true                        # a run of the answer of 20+ characters that also occurs in the user's task
                                           # (sub/superscripts, emphasis, quote marks and spacing ignored) is a quotation
                                           # of the material under review: checkers and the arithmetic check (when the
                                           # task writes the same a × b = c) only report a fix inside it, a claim
                                           # that is a quotation plus at most a label or verdict mark (✗ WRONG) is not
                                           # checked, and a review fix that changes quoted text is skipped; false: as before
  reference_over_literature: true          # a claim the judge supports only from literature passages is unverified when a
                                           # retrieved reference record gives another value for the same quantity (a number
                                           # with the same unit, within ×2, in a line or sentence holding half the claim's
                                           # words); nothing is rewritten; false: as before. No effect without literature
  checkers: [element_balance]              # domain checker plug-ins run on every draft (code only); [] = none
  checkers_clear_only: true                # a checker rewrites only what is clearly its subject; a fix it doubts is
                                           # only reported (element_balance: a formula with an explicit count of 1
                                           # such as P₁V₁ or S1, a written number over 20 in front such as 1000 IU,
                                           # or a label of the task or answer such as S4 in a line "S4. …" next to
                                           # "S5. …"); false: as before
  research_k: 2                            # records per re-search of an unsupported claim
  max_research: 6                          # claims re-searched per answer
  answer_style: plain                      # plain: a normal chat answer, checks applied silently (trace in the
                                           # reasoning block); annotated: [S#], labels, summary, source list (debugging)
  consistency_check: true                  # after the claim checks: one review call over the whole answer and the task
  consistency_prompt: |
    You review an answer to the user's task for one thing only: places where the answer contradicts itself,
    that is two statements of the answer that cannot both be true. Look for:
    1. conclusions, verdicts, summaries, answer lines or table cells that differ from the answer's own
       calculations or evidence;
    2. verdict labels that conflict with the answer's own stated reasons (for example "true" next to a reason
       that shows it is false);
    3. a value or fact stated one way in one part and another way in another part.
    Do not solve the task again, do not judge whether the answer is right or reads the task right, do not
    re-check facts against outside knowledge, do not add new content, and do not reword or restyle the text.
    A fix must take its value or verdict from the other statement of the answer, as written there.
    If there is no such problem, reply with exactly: OK
    Otherwise reply with one block per fix and nothing else:
    OLD: <a short exact quote from the answer, on one line, that appears only once: the statement to fix>
    NEW: <its corrected replacement>
    CONFLICT: <a short exact quote, on one line, of the other statement of the answer that OLD contradicts>
    WHY: <one short reason>
  consistency_quotes: true                 # a review fix is applied only when its CONFLICT quote is elsewhere in the
                                           # answer, every number NEW adds is stated there or computed there (in code),
                                           # and, for an answer/verdict line (A1: …) or a fix without a number, every word
                                           # NEW adds is in it; false: any OLD that occurs once is replaced
  consistency_keep_answer_lines: true      # the review never changes a labelled answer/verdict line (A1: …, Claim C: …,
                                           # as for skip_derived_claims): the reasoning says it was kept and names the
                                           # conflict; false: such lines follow consistency_quotes like other text
  request:                                 # fields merged into every judge call (per-model quirks, D-013)
    temperature: 0.0
    max_tokens: 1024
    chat_template_kwargs: {enable_thinking: false}   # llama.cpp + Qwen templates: no thinking for the judge

llama_server:                              # local reasoner, started by `uv run haisenberg`
  enabled: "${LLAMA_SERVER_ENABLED:-true}" # false: use an already running or remote backend
  executable: "${LLAMA_SERVER_EXE:-llama-server}"
  model_path: "${MODEL_PATH:-models/Qwen3.5-9B-Q4_K_M.gguf}"
  host: "${LLAMA_HOST:-127.0.0.1}"
  port: "${LLAMA_PORT:-8080}"              # keep in step with model_backend.api_base
  ctx_size: "${CTX_SIZE:-16384}"           # bigger models/machines: raise via env (D-020)
  startup_timeout_s: 300
  env:
    GGML_VK_VISIBLE_DEVICES: "${LLAMA_VK_DEVICES:-1}"   # Vulkan1 = RTX 4050, Vulkan0 = AMD iGPU
  flags:                                   # true -> --flag, false/null -> omitted, else --flag value
    no-ui: true                            # this app serves the UI
    jinja: true                            # use the GGUF's own chat template (tool calls later)
    reasoning: "on"
    reasoning-format: deepseek             # thinking arrives as reasoning_content
    reasoning-budget: "${REASONING_BUDGET:-1024}"                 # thinking-token cap: Qwen3.5 otherwise thinks ~4k tokens (~6 min at 11 t/s)
    parallel: 1
    n-predict: 8192
    gpu-layers: "${GPU_LAYERS:-99}"                         # all layers on the GPU: 9B Q4_K_M just fits in 6 GB
    fit: "off"                             # auto-fit keeps 1 GB free and pushes most layers to the CPU (5x slower)
    flash-attn: auto
    cache-type-k: q8_0
    cache-type-v: q8_0
    threads: "${LLAMA_THREADS:-8}"
    log-file: "${LLAMA_LOG_FILE:-}"        # keep llama-server's own log in this file (empty = console only)

ui:
  dist_dir: "ui/dist"                      # built by scripts/build_ui.py
  settings: {}                             # WebUI defaults, served as /props ui_settings

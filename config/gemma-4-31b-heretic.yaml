# gemma-4-31B-it-uncensored-heretic (llmfan46): Gemma 4 31B instruct with refusals removed (heretic abliteration;
# KL divergence 0.054 to its base, MMLU 85.9 vs 86.5). UGI leaderboard: willingness 10/10, NatInt 36.4, Textbook 43.9
# (52.2 for qwen3.5-35b-a3b-heretic). Dense: every token reads all weights, so expect ~2 tokens/s here.
# Own chat template, handled by llama.cpp's Gemma4 parser (b11782): thinking in a `<|channel>thought ... <channel|>`
# block, native tool calls `<|tool_call>call:NAME{key:value}<tool_call|>`, thinking on/off via enable_thinking.
# GGUF: mradermacher/gemma-4-31B-it-uncensored-heretic-i1-GGUF, i1-IQ3_M (14.4 GB), text only (no mmproj).
# Fit (6 GB GPU, 14.5 GB WSL): the last 18 of 60 layers and their KV cache on the GPU, the rest (~10.4 GB) in RAM.
# License: Apache-2.0.
# Use: MODEL_PROFILE=gemma-4-31b-heretic

model_backend:
  model_id: "${MODEL_ID:-gemma-4-31b-heretic}"
  temperature: 1.0                         # the model card's one setting for every use: 1.0, top_p 0.95, top_k 64
  extra_body:
    top_p: 0.95
    top_k: 64
    min_p: 0.0
    presence_penalty: 0.0

reasoning_policy:
  tool_call_markup:                        # Gemma 4 writes calls as call:NAME{key:<|"|>text<|"|>,...}
    call: '<\|tool_call>.*?(?:<tool_call\|>|$)'
    function: '<\|tool_call>call:([\w.-]+)'
    parameter: '(\w+):<\|"\|>(.*?)<\|"\|>' # text arguments only; a leaked call with list arguments is dropped

llama_server:
  model_path: "${MODEL_PATH:-models/gemma-4-31B-it-uncensored-heretic.i1-IQ3_M.gguf}"
  ctx_size: "${CTX_SIZE:-16384}"           # as for the default model; full-attention layers hold ~70 MB of KV each
  flags:
    gpu-layers: "${GPU_LAYERS:-18}"        # ~0.25 GB per layer with its KV cache; lower if CUDA runs out of memory

# Test arm only (branch reasoning-stack, not for main): every reasoning PR on, for one package A/B against main
# (#63 prompt, #54 thinking budget, #55 compute tool, #64 ledger + R-g, #65 independent check, #66 guards, #67 carry
# forward, #69 number reading). The defaults already turn on #63, #54, #55, #66, #69; this adds the three switches.
# Use: MODEL_PROFILE=qwen3.5-9b-reasoning-all (stack at reasoning-budget 4096).

model_backend:
  model_id: "${MODEL_ID:-qwen3.5-9b}"

llama_server:
  model_path: "${MODEL_PATH:-models/Qwen3.5-9B-Q4_K_M.gguf}"

evidence:
  enabled: true
  independent: true

verifier:
  carry_fixes_forward: true
  arithmetic_answer_lines: false   # #67 carries fixes in any format; #41's labelled-line rule is format-bound (D-042)
                                   # and on the replay of all drafts 4 of its 9 changed lines were false (LOG 11-01)
